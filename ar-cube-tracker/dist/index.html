<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AR Cube Tracker</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
      #ar-container { position: relative; width: 100vw; height: 100vh; }
      #ar-container video {
        position: absolute !important;
        top: 0 !important; left: 0 !important;
        width: 100% !important; height: 100% !important;
        object-fit: cover !important;
        z-index: 0 !important;
      }
      #ar-container canvas {
        position: absolute !important;
        top: 0 !important; left: 0 !important;
        width: 100% !important; height: 100% !important;
        z-index: 1 !important;
        background: transparent !important;
      }
    </style>
  </head>
  <body>
    <div id="ar-container"></div>
    <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.150.0/examples/jsm/"
      }
    }
    </script>
    <script type="module" src="/src/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/eruda@3/eruda.min.js"></script>
  <script>eruda.init();</script>
  </body>
</html>

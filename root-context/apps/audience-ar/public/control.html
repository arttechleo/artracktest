<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROOT - Show Control</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    padding: 12px;
    max-width: 900px;
    margin: 0 auto;
  }
  h1 { color: #00d4ff; font-size: 1.4rem; margin-bottom: 4px; }
  .status { font-size: 0.8rem; margin-bottom: 12px; }
  .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .connected .dot { background: #00ff66; }
  .disconnected .dot { background: #ff4444; }

  .section { margin-bottom: 16px; border: 1px solid #222; border-radius: 8px; padding: 10px; }
  .section h2 { font-size: 0.9rem; color: #00d4ff; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }

  .btn-row { display: flex; flex-wrap: wrap; gap: 6px; }
  button {
    padding: 10px 14px; border: none; border-radius: 6px; cursor: pointer;
    font-size: 0.8rem; font-weight: 600; transition: all 0.15s;
    min-width: 80px; text-align: center;
  }
  button:active { transform: scale(0.95); }

  .btn-green { background: #00aa44; color: white; }
  .btn-red { background: #cc2233; color: white; }
  .btn-blue { background: #0066cc; color: white; }
  .btn-cyan { background: #008899; color: white; }
  .btn-purple { background: #6633aa; color: white; }
  .btn-orange { background: #cc6600; color: white; }
  .btn-gold { background: #aa8800; color: white; }
  .btn-dark { background: #333; color: #ccc; }
  .btn-pink { background: #cc3388; color: white; }
  .btn-white { background: #ddd; color: #111; }

  .btn-large { padding: 14px 20px; font-size: 1rem; min-width: 120px; }

  .countdown-row { display: flex; gap: 4px; flex-wrap: wrap; }
  .countdown-row button { min-width: 50px; font-size: 1.1rem; font-weight: 900; }

  .relay-input { display: flex; gap: 6px; margin-bottom: 12px; }
  .relay-input input {
    flex: 1; padding: 8px; background: #1a1a2a; border: 1px solid #333;
    color: #e0e0e0; border-radius: 6px; font-size: 0.8rem;
  }
  .relay-input button { padding: 8px 16px; }

  .log {
    background: #111; border: 1px solid #222; border-radius: 6px;
    padding: 8px; font-family: monospace; font-size: 0.7rem;
    max-height: 120px; overflow-y: auto; color: #888;
  }
  .log .sent { color: #00d4ff; }
  .log .recv { color: #00ff66; }
  .log .err { color: #ff4444; }
</style>
</head>
<body>

<h1>ROOT Show Control</h1>
<div class="status disconnected" id="status">
  <span class="dot"></span><span id="statusText">Disconnected</span>
</div>

<div class="relay-input">
  <input id="relayUrl" value="" placeholder="wss://relay-url.trycloudflare.com">
  <button class="btn-green" onclick="connect()">Connect</button>
</div>

<!-- PLUTO AVATAR -->
<div class="section">
  <h2>Pluto Avatar</h2>
  <div class="btn-row">
    <button class="btn-green btn-large" onclick="send('ghost_character', {visible: true})">Pluto APPEAR</button>
    <button class="btn-red btn-large" onclick="send('ghost_character', {visible: false})">Pluto DISAPPEAR</button>
    <button class="btn-dark" onclick="send('ghost_character', {visible: true, state: 'frozen'})">FREEZE</button>
    <button class="btn-red" onclick="send('ghost_character', {visible: true, state: 'hacked'})">HACKED</button>
    <button class="btn-cyan" onclick="send('ghost_character', {visible: true, state: 'normal'})">Normal</button>
  </div>
</div>

<!-- AURA / EMOTION -->
<div class="section">
  <h2>Aura / Emotion <span style="font-weight: normal; opacity: 0.6; font-size: 0.7rem;">(glow + face)</span></h2>
  <div class="btn-row">
    <button class="btn-cyan" onclick="sendAura('neutral')">Neutral (Cyan)</button>
    <button class="btn-red" onclick="sendAura('angry')">Angry (Red)</button>
    <button class="btn-purple" onclick="sendAura('sad')">Sad (Purple)</button>
    <button class="btn-pink" onclick="sendAura('joyful')">Joyful (Pink)</button>
    <button class="btn-purple" onclick="sendAura('afraid')">Afraid (Violet)</button>
    <button class="btn-gold" onclick="sendAura('glowing')">Glowing (Gold)</button>
  </div>
</div>

<!-- FACE EMOTES (face only, no aura color change) -->
<div class="section">
  <h2>Face Emotes <span style="font-weight: normal; opacity: 0.6; font-size: 0.7rem;">(blendshape expressions, face only)</span></h2>
  <div class="btn-row">
    <button class="btn-white" onclick="sendEmote('neutral')">Neutral</button>
    <button class="btn-pink" onclick="sendEmote('happy')">Happy</button>
    <button class="btn-purple" onclick="sendEmote('sad')">Sad</button>
    <button class="btn-red" onclick="sendEmote('angry')">Angry</button>
    <button class="btn-orange" onclick="sendEmote('surprised')">Surprised</button>
    <button class="btn-cyan" onclick="sendEmote('confused')">Confused</button>
    <button class="btn-purple" onclick="sendEmote('scared')">Scared</button>
    <button class="btn-dark" onclick="sendEmote('contemplative')">Contemplative</button>
  </div>
</div>

<!-- XR BLACKOUT -->
<div class="section">
  <h2>XR Scene</h2>
  <div class="btn-row">
    <button class="btn-dark btn-large" onclick="send('xr_blackout', {active: true})">XR BLACKOUT</button>
    <button class="btn-blue btn-large" onclick="send('xr_blackout', {active: false})">XR ON</button>
    <button class="btn-cyan" onclick="send('lighting_cue', {preset: 'chapel'})">Chapel XR</button>
    <button class="btn-red" onclick="send('lighting_cue', {preset: 'red'})">Red Stage</button>
    <button class="btn-gold" onclick="send('lighting_cue', {preset: 'coffin'})">Coffin Glow</button>
    <button class="btn-dark" onclick="send('lighting_cue', {preset: 'dark'})">Dark</button>
  </div>
</div>

<!-- COUNTDOWN -->
<div class="section">
  <h2>Countdown (CAssi)</h2>
  <div class="countdown-row">
    <button class="btn-orange" onclick="sendCountdown(10)">10</button>
    <button class="btn-orange" onclick="sendCountdown(9)">9</button>
    <button class="btn-orange" onclick="sendCountdown(8)">8</button>
    <button class="btn-orange" onclick="sendCountdown(7)">7</button>
    <button class="btn-orange" onclick="sendCountdown(6)">6</button>
    <button class="btn-orange" onclick="sendCountdown(5)">5</button>
    <button class="btn-orange" onclick="sendCountdown(4)">4</button>
    <button class="btn-orange" onclick="sendCountdown(3)">3</button>
    <button class="btn-orange" onclick="sendCountdown(2)">2</button>
    <button class="btn-orange" onclick="sendCountdown(1)">1</button>
    <button class="btn-red" onclick="sendCountdown(0)">0</button>
  </div>
</div>

<!-- PROJECTIONS -->
<div class="section">
  <h2>Projections / Text</h2>
  <div class="btn-row">
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2381')">Year 2381</button>
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2050')">Year 2050</button>
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2065')">Year 2065</button>
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2074')">Year 2074</button>
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2057')">Year 2057</button>
    <button class="btn-dark" onclick="sendProjection('year', 'Year 2130')">Year 2130</button>
    <button class="btn-blue" onclick="sendProjection('subtitle', 'In Memoriam')">In Memoriam</button>
    <button class="btn-dark" onclick="sendProjection('clear', '')">CLEAR</button>
  </div>
</div>

<!-- CALL AND RESPONSE -->
<div class="section">
  <h2>Call and Response</h2>
  <div class="btn-row">
    <button class="btn-blue" onclick="sendProjection('call_response', 'Pluto, ascend!')">Pluto, ascend!</button>
    <button class="btn-blue" onclick="sendProjection('call_response', 'She is ascended indeed!')">She is ascended indeed!</button>
    <button class="btn-blue" onclick="sendProjection('call_response', 'We welcome you to the new world.')">We welcome you...</button>
    <button class="btn-dark" onclick="sendProjection('clear', '')">CLEAR</button>
  </div>
</div>

<!-- DIGITAL PROPS -->
<div class="section">
  <h2>Digital Props</h2>
  <div class="btn-row">
    <button class="btn-gold" onclick="send('prop', {id: 'cake', action: 'show'})">Cake APPEAR</button>
    <button class="btn-dark" onclick="send('prop', {id: 'cake', action: 'hide'})">Cake HIDE</button>
    <button class="btn-orange" onclick="send('prop', {id: 'candles', action: 'light'})">Light Candles</button>
    <button class="btn-dark" onclick="send('prop', {id: 'candles', action: 'blowout'})">Blow Out</button>
    <button class="btn-gold" onclick="send('prop', {id: 'coin', action: 'show'})">Coin APPEAR</button>
    <button class="btn-dark" onclick="send('prop', {id: 'coin', action: 'hide'})">Coin HIDE</button>
  </div>
</div>

<!-- JUDGMENT / TIME GIVEAWAY -->
<div class="section">
  <h2>Judgment / Time Giveaway</h2>
  <div class="btn-row">
    <button class="btn-purple btn-large" onclick="send('interaction', {mode: 'judgment', active: true})">START Judgment</button>
    <button class="btn-dark btn-large" onclick="send('interaction', {mode: 'judgment', active: false})">END Judgment</button>
  </div>
</div>

<!-- LOG -->
<div class="section">
  <h2>Log</h2>
  <div class="log" id="log"></div>
</div>

<script>
let ws = null;
const logEl = document.getElementById('log');
const statusEl = document.getElementById('status');
const statusText = document.getElementById('statusText');
const urlInput = document.getElementById('relayUrl');

// Auto-detect relay URL from current page or use default
const params = new URLSearchParams(window.location.search);
urlInput.value = params.get('relay') || 'wss://root-relay.onrender.com';

function log(msg, cls = '') {
  const line = document.createElement('div');
  line.className = cls;
  line.textContent = new Date().toLocaleTimeString() + ' ' + msg;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function connect() {
  if (ws) { ws.close(); ws = null; }
  const url = urlInput.value;
  log('Connecting to ' + url + '...');

  try {
    // Bypass ngrok/cloudflare warning
    fetch(url.replace('wss://', 'https://').replace('ws://', 'http://'), {
      mode: 'cors',
      headers: { 'ngrok-skip-browser-warning': 'true' }
    }).catch(() => {});
  } catch(e) {}

  setTimeout(() => {
    ws = new WebSocket(url);

    ws.onopen = () => {
      log('Connected!', 'recv');
      statusEl.className = 'status connected';
      statusText.textContent = 'Connected';

      // Handshake as show_control
      ws.send(JSON.stringify({
        type: 'handshake',
        role: 'show_control',
        token: 'root-theater-2026'
      }));
    };

    ws.onmessage = (e) => {
      try {
        const msg = JSON.parse(e.data);
        if (msg.type === 'welcome') {
          log('Welcome! Audience: ' + (msg.audience || 0), 'recv');
        } else {
          log('Recv: ' + msg.type, 'recv');
        }
      } catch(err) {
        log('Recv: ' + e.data, 'recv');
      }
    };

    ws.onclose = () => {
      log('Disconnected', 'err');
      statusEl.className = 'status disconnected';
      statusText.textContent = 'Disconnected';
    };

    ws.onerror = (e) => {
      log('Error: ' + e.type, 'err');
    };
  }, 500);
}

function send(type, data) {
  if (!ws || ws.readyState !== WebSocket.OPEN) {
    log('Not connected!', 'err');
    return;
  }
  const msg = { type, data };
  ws.send(JSON.stringify(msg));
  log('Sent: ' + type + ' ' + JSON.stringify(data), 'sent');
}

const EMOTION_COLORS = {
  neutral: { x: 0.0, y: 0.8, z: 1.0 },   // Cyan
  angry:   { x: 1.0, y: 0.0, z: 0.2 },   // Red-crimson
  sad:     { x: 0.3, y: 0.0, z: 0.8 },   // Deep purple
  joyful:  { x: 1.0, y: 0.0, z: 0.6 },   // Hot pink
  afraid:  { x: 0.5, y: 0.0, z: 1.0 },   // Violet
  glowing: { x: 1.0, y: 0.9, z: 0.3 },   // Gold (ascension)
};

function sendAura(emotion) {
  const color = EMOTION_COLORS[emotion] || EMOTION_COLORS.neutral;
  send('aura', {
    emotion: emotion,
    intensity: emotion === 'neutral' ? 0.4 : emotion === 'angry' ? 0.9 : 0.7,
    pulseRate: emotion === 'angry' ? 3.0 : emotion === 'glowing' ? 2.0 : emotion === 'afraid' ? 2.5 : 1.0,
    color: color
  });
  // Also fire matching facial emote on Pluto v2 (blendshapes).
  // Aura sets glow color; emote sets face expression. They compose nicely.
  const auraToEmote = {
    neutral: 'neutral',
    angry: 'angry',
    sad: 'sad',
    joyful: 'happy',
    afraid: 'scared',
    glowing: 'happy',     // glowing → happy face
  };
  const faceEmote = auraToEmote[emotion];
  if (faceEmote) {
    send('emote', { name: faceEmote });
  }
}

function sendEmote(name, duration) {
  // Standalone emote trigger — face only, no aura change.
  const payload = { name: name };
  if (duration != null) payload.duration = duration;
  send('emote', payload);
}

function sendCountdown(num) {
  send('countdown', { number: num, active: num > 0 });
  sendProjection('year', num > 0 ? num.toString() : 'ZERO');
}

function sendProjection(style, text) {
  send('projection', { style, text });
}

// Auto-connect on load
window.addEventListener('load', () => {
  setTimeout(connect, 300);
});
</script>
</body>
</html>
